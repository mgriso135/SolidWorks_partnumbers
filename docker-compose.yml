services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partcode
      POSTGRES_USER: partcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partcode}
    volumes:
      - partcode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partcode -d partcode"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://partcode:${POSTGRES_PASSWORD:-partcode}@db:5432/partcode
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the environment}
      SEED_DEMO: ${SEED_DEMO:-true}
      AUTO_CREATE_TABLES: "false"
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:7000,http://127.0.0.1:7000}
      ERP_ADAPTER: ${ERP_ADAPTER:-stub}
      ERP_FILE_PATH: ${ERP_FILE_PATH:-}
      ERP_BASE_URL: ${ERP_BASE_URL:-}
      ERP_LOOKUP_PATH: "${ERP_LOOKUP_PATH:-/items/{code}}"
      ERP_API_KEY: ${ERP_API_KEY:-}
      ERP_API_KEY_HEADER: ${ERP_API_KEY_HEADER:-Authorization}
      ERP_API_KEY_PREFIX: "${ERP_API_KEY_PREFIX:-Bearer }"
      ERP_TIMEOUT_SECONDS: ${ERP_TIMEOUT_SECONDS:-10}
    ports:
      - "7000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  partcode-postgres:
